apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-api
  namespace: fase4
  labels:
    app: games-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: games-api
  template:
    metadata:
      labels:
        app: games-api
    spec:
      serviceAccountName: games-api
      containers:
      - name: games-api
        image: adinteltidev/games-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: AWS__Region
          value: us-east-1
        - name: DynamoDb__GamesTable
          value: Games
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-secret
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-issuer
        - name: Jwt__Audience
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-audience
        - name: RabbitMq__Host
          value: rabbitmq
        - name: RabbitMq__Port
          value: "5672"
        - name: RabbitMq__Username
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: rabbitmq-user
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: rabbitmq-pass
        - name: RabbitMq__PaymentQueueName
          value: payment-queue
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
