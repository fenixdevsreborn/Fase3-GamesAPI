services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ms-games-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms-network

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    container_name: ms-games-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    networks:
      - ms-network

  dynamodb-init:
    image: amazon/aws-cli:2.15.57
    container_name: ms-games-dynamodb-init
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do sleep 2; done;
        aws dynamodb create-table
        --endpoint-url http://dynamodb-local:8000
        --table-name Games
        --attribute-definitions AttributeName=Id,AttributeType=S
        --key-schema AttributeName=Id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        || true
    depends_on:
      dynamodb-local:
        condition: service_started
    networks:
      - ms-network

  games-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-games-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      AWS__Region: us-east-1
      AWS__ServiceURL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DynamoDb__GamesTable: Games
      Jwt__Secret: "your-super-secret-key-at-least-32-characters-long!"
      Jwt__Issuer: "ms-users-api"
      Jwt__Audience: "ms-users-api-client"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: admin
      RabbitMq__Password: admin123
      RabbitMq__PaymentQueueName: payment-queue
    depends_on:
      rabbitmq:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    networks:
      - ms-network

volumes:
  rabbitmq_data:

networks:
  ms-network:
    driver: bridge
